name: Corporate case checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: make setup PYTHON=python
      - run: make test
      - run: make evidence
